# Broken on purpose: the order is right, but customers-api is pinned to a version from before
# the endpoint payments-api 2.3.1 relies on. Ordering alone wouldn't save this release.
#
#   dotnet run validate-manifest.cs -- --manifest test/fixtures/customers-too-old.yml
extends:
  template: ../../../pipelines/templates/release.yml
  parameters:
    release: '2026.11.04'
    steps:
      - { id: deploy_identity,  deploy: identity-api,  version: 1.5.2 }
      - { id: deploy_catalog,   deploy: catalog-api,   version: 3.0.4 }
      - { id: deploy_customers, deploy: customers-api, version: 1.1.4, dependsOn: [deploy_identity] }
      - { id: deploy_payments,  deploy: payments-api,  version: 2.3.1, dependsOn: [deploy_customers] }
      - { id: deploy_orders,    deploy: orders-api,    version: 1.8.0, dependsOn: [deploy_catalog, deploy_payments] }
