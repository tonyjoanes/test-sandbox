# =============================================================================
# 09 — Deployment Jobs & Environments
# =============================================================================
# A 'deployment' job is a special job type for anything that ships code
# somewhere. Two things it gives you that a plain 'job' doesn't:
#
#   1. 'environment:' ties the job to an Azure DevOps Environment resource.
#      Environments are where you configure things that CANNOT live in YAML
#      for security reasons — manual approval gates, business hours checks,
#      branch-control checks. These are configured once in the Azure DevOps
#      UI (Pipelines > Environments > <env> > Approvals and checks) and then
#      apply automatically to every pipeline that deploys to that
#      environment. This is deliberate: approvers shouldn't be editable by
#      whoever can edit the YAML.
#
#   2. 'strategy:' describes HOW the deployment rolls out. A strategy is
#      built from named "lifecycle hooks" — deploy / routeTraffic /
#      postRouteTraffic / on:success / on:failure — and each hook is just a
#      plain list of steps, exactly like a job's steps. What differs
#      between strategies is HOW MANY TIMES those hooks run:
#
#      runOnce   deploy -> routeTraffic -> postRouteTraffic -> on:success/failure
#                Every hook runs exactly ONCE. Almost everyone only fills
#                in 'deploy:' and skips the rest — see DeployDev/
#                DeployStaging below, which do exactly that.
#
#      canary    For EACH percentage in 'increments':
#                    deploy -> routeTraffic -> postRouteTraffic
#                ...then, once, after every increment has run:
#                    on:success (or on:failure the moment one fails)
#                The deploy/routeTraffic/postRouteTraffic trio REPEATS once
#                per entry in 'increments' — pass 1 might route 10% of
#                traffic, pass 2 25%, and so on. Azure does NOT manage that
#                percentage for you: your own steps read which pass they're
#                in via the built-in $(strategy.increment) variable and act
#                on it. See DeployProduction below.
#
#      rolling   Batches through a classic Deployment Group (a fixed pool
#                of VMs registered with Azure DevOps) rather than a
#                Microsoft-hosted pool — a different targeting model, so
#                it isn't shown in this file's examples.
# =============================================================================

trigger:
  - main

stages:
  - stage: Build
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: echo "Building..."
          - publish: $(System.DefaultWorkingDirectory)
            artifact: drop

  # ---------------------------------------------------------------------------
  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy web app'
        pool:
          vmImage: 'ubuntu-latest'
        # No approval gate configured on "dev" — deploys flow straight
        # through automatically. Good for a low-stakes environment.
        environment: 'dev'
        strategy:
          runOnce:
            # 'deploy:' is a lifecycle hook name, not a special keyword you
            # configure — it just happens to be the only hook most runOnce
            # deployments need. Steps under it run exactly like normal job
            # steps, once.
            deploy:
              steps:
                - script: echo "Deploying build $(Build.BuildId) to Dev"
                - script: echo "Smoke testing Dev..."

  # ---------------------------------------------------------------------------
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployDev
    jobs:
      - deployment: DeployWebApp
        pool:
          vmImage: 'ubuntu-latest'
        # 'staging' environment (configured in the Azure DevOps UI) has a
        # required-reviewer check attached — the pipeline run will PAUSE
        # here in the portal until someone approves it. That pause and the
        # reviewer list live entirely in the Environment resource, not here.
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying build $(Build.BuildId) to Staging"

  # ---------------------------------------------------------------------------
  - stage: DeployProduction
    displayName: 'Deploy to Production (canary)'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployWebApp
        pool:
          vmImage: 'ubuntu-latest'
        # 'production' typically has BOTH a required-reviewer check and a
        # business-hours check configured in the UI, on top of the canary
        # rollout choreography defined here in YAML.
        environment: 'production'
        strategy:
          canary:
            # 4 entries -> the deploy/postRouteTraffic hooks below each run
            # 4 TIMES total: once as a 10% pass, once as a 25% pass, etc.
            increments: [10, 25, 50, 100]
            deploy:
              steps:
                # $(strategy.increment) is set by Azure to whichever number
                # from 'increments' this pass is currently on — this is
                # the ONLY thing that tells your steps which wave they're
                # in. Without reading it, every pass would look identical.
                - script: echo "Canary pass — routing $(strategy.increment)% of traffic to the new version"
            postRouteTraffic:
              steps:
                - script: echo "Monitoring health metrics at $(strategy.increment)% traffic..."
            # 'on:' hooks run ONCE TOTAL — after the final (100%) increment
            # completes successfully, or immediately when ANY increment
            # fails — not once per increment like deploy/postRouteTraffic
            # above.
            on:
              failure:
                steps:
                  - script: echo "A canary increment failed health checks — rolling back all traffic"
              success:
                steps:
                  - script: echo "All increments (10% -> 25% -> 50% -> 100%) succeeded — canary complete"

# -----------------------------------------------------------------------------
# NOTE on 'environment:' with resource targeting — you can also scope a
# deployment to a specific resource within an environment (e.g. one VM in a
# VM group, or a specific Kubernetes namespace):
#
#   environment: 'production.frontend-namespace'
#
# and Azure DevOps will show per-resource deployment history in the
# Environments view, which is invaluable for auditing "what version is
# running where" across a fleet.
# -----------------------------------------------------------------------------
