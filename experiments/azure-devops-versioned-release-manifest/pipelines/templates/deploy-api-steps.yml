# Deploys one API package to one App Service, using zero-downtime slot swaps:
#
#   live version check ─► deploy to staging slot ─► wait for slot /version ─► swap ─► verify live
#
# If live already reports the manifest's version, every step after the check is skipped. That's
# why a manifest can list all five APIs every time: unchanged ones cost a single HTTP call.
#
# The checks are scripts in ../scripts, not inline bash, so scripts/test-deploy-scripts.cs can
# run them locally against a real API. The validate stage publishes them as the
# `release-scripts` artifact, since deployment jobs don't check out the repo.

parameters:
  - name: api
    type: string
  - name: version
    type: string
  - name: appName
    type: string
  - name: resourceGroup
    type: string
  - name: serviceConnection
    type: string
  - name: slot
    type: string
    default: staging
  - name: appType
    type: string
    default: webAppLinux  # webApp for Windows App Service plans

steps:
  # Only this API's package, taken from the artifact the validate stage checked. Adding explicit
  # download steps also turns off the deployment job's default "download everything".
  - download: current
    artifact: packages
    patterns: ${{ parameters.api }}/**

  - download: current
    artifact: release-scripts

  - task: AzureCLI@2
    displayName: Live version check
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: >
        bash "$(Pipeline.Workspace)/release-scripts/check-live-version.sh"
        '${{ parameters.resourceGroup }}' '${{ parameters.appName }}' '${{ parameters.version }}'

  - task: AzureWebApp@1
    displayName: Deploy ${{ parameters.version }} to '${{ parameters.slot }}' slot
    condition: and(succeeded(), ne(variables.upToDate, 'true'))
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      appType: ${{ parameters.appType }}
      appName: ${{ parameters.appName }}
      deployToSlotOrASE: true
      resourceGroupName: ${{ parameters.resourceGroup }}
      slotName: ${{ parameters.slot }}
      package: $(Pipeline.Workspace)/packages/${{ parameters.api }}/app.zip

  - task: AzureCLI@2
    displayName: Wait for '${{ parameters.slot }}' slot to report ${{ parameters.version }}
    condition: and(succeeded(), ne(variables.upToDate, 'true'))
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: >
        bash "$(Pipeline.Workspace)/release-scripts/wait-for-version.sh"
        '${{ parameters.resourceGroup }}' '${{ parameters.appName }}' '${{ parameters.version }}' '${{ parameters.slot }}'

  - task: AzureAppServiceManage@0
    displayName: Swap '${{ parameters.slot }}' into production
    condition: and(succeeded(), ne(variables.upToDate, 'true'))
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      Action: Swap Slots
      WebAppName: ${{ parameters.appName }}
      ResourceGroupName: ${{ parameters.resourceGroup }}
      SourceSlot: ${{ parameters.slot }}
      SwapWithProduction: true

  - task: AzureCLI@2
    displayName: Verify production reports ${{ parameters.version }}
    condition: and(succeeded(), ne(variables.upToDate, 'true'))
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: >
        bash "$(Pipeline.Workspace)/release-scripts/verify-production.sh"
        '${{ parameters.resourceGroup }}' '${{ parameters.appName }}' '${{ parameters.version }}' '${{ parameters.slot }}'
