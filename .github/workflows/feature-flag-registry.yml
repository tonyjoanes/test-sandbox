# Validates and applies the feature flag registry in
# experiments/azure-appconfig-feature-flag-registry/. Scoped via `paths:` so it only runs when
# that experiment's files change — this repo hosts several unrelated experiments, not just
# this one.
#
# Validation and the dry-run both run on every PR, with zero Azure credentials needed — that's
# deliberate, see the scripts' own comments. The apply jobs only run on push to main (a merge),
# and only do anything if this repo has real Azure OIDC federation configured (it doesn't, in
# this sandbox) — see "Running This For Real" in the experiment's README for what that setup
# looks like.

name: Feature Flag Registry

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/azure-appconfig-feature-flag-registry/**'
      - '.github/workflows/feature-flag-registry.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/azure-appconfig-feature-flag-registry/**'
      - '.github/workflows/feature-flag-registry.yml'

defaults:
  run:
    working-directory: experiments/azure-appconfig-feature-flag-registry

jobs:
  validate:
    name: Validate flags against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: experiments/azure-appconfig-feature-flag-registry/scripts/package-lock.json
      - run: npm ci
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      - run: npm test
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      - run: node validate.mjs
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts

  check-flag-references:
    name: Check app code references real flags
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` here on purpose — the check greps app source as plain text, it never
      # imports or runs it, so the app's own dependencies aren't needed to check it.
      - run: node check-flag-references.mjs
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts

  dry-run:
    name: Dry-run (${{ matrix.environment }})
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: experiments/azure-appconfig-feature-flag-registry/scripts/package-lock.json
      - run: npm ci
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      - run: node apply.mjs --environment ${{ matrix.environment }} --dry-run
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
        env:
          # Reviewer-visible even without real Azure access configured. When the real store
          # names ARE configured (see below), this shows the exact commands the apply jobs
          # below would run on merge — the whole point of reviewing a flag change before
          # it ships.
          APPCONFIG_STORE_DEV: ${{ vars.APPCONFIG_STORE_DEV }}
          APPCONFIG_STORE_STAGING: ${{ vars.APPCONFIG_STORE_STAGING }}
          APPCONFIG_STORE_PROD: ${{ vars.APPCONFIG_STORE_PROD }}

  apply-dev:
    name: Apply (dev)
    needs: [validate, check-flag-references]
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: experiments/azure-appconfig-feature-flag-registry/scripts/package-lock.json
      - run: npm ci
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
      - run: node apply.mjs --environment dev --apply
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
        env:
          APPCONFIG_STORE_DEV: ${{ vars.APPCONFIG_STORE_DEV }}

  apply-staging:
    name: Apply (staging)
    needs: apply-dev
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: experiments/azure-appconfig-feature-flag-registry/scripts/package-lock.json
      - run: npm ci
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_STAGING }}
      - run: node apply.mjs --environment staging --apply
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
        env:
          APPCONFIG_STORE_STAGING: ${{ vars.APPCONFIG_STORE_STAGING }}

  apply-prod:
    name: Apply (prod)
    needs: apply-staging
    if: github.event_name == 'push' && vars.AZURE_CLIENT_ID_PROD_DEPLOYER != ''
    runs-on: ubuntu-latest
    # `environment: prod` is the actual gate: GitHub pauses this job for the Environment's
    # required reviewer BEFORE the runner even starts, so nothing below executes, nothing
    # authenticates to Azure, until a human approves. That pause (and who counts as an
    # approver) is configured on the Environment itself, in the repo's Settings — it
    # can't be set from inside this YAML, which is deliberate: whoever can edit this file
    # should not also be able to grant themselves approval by editing the same file. See the
    # experiment's README, "The Gates", for the exact setup steps and why this repo doesn't
    # have it configured yet.
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: experiments/azure-appconfig-feature-flag-registry/scripts/package-lock.json
      - run: npm ci
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
      # A DIFFERENT identity from apply-dev/apply-staging's $AZURE_CLIENT_ID — see
      # README, "The Gates", for why: the standing CI identity only has Data Reader on prod,
      # so it structurally cannot write here even if this `if`/environment gate were somehow
      # bypassed. Only this identity, AZURE_CLIENT_ID_PROD_DEPLOYER, holds Data Owner on
      # prod, and its federated credential trusts nothing but a token minted from a run of
      # THIS job — which GitHub will not mint until the environment's reviewer approves.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD_DEPLOYER }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_PROD }}
      - run: node apply.mjs --environment prod --apply
        working-directory: experiments/azure-appconfig-feature-flag-registry/scripts
        env:
          APPCONFIG_STORE_PROD: ${{ vars.APPCONFIG_STORE_PROD }}
