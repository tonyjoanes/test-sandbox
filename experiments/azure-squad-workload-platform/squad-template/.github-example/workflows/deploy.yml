# The squad repo's whole pipeline. Copy to .github/workflows/deploy.yml in the squad's repo.
# (It lives under .github-example/ here so GitHub doesn't try to run it in this sandbox repo.)
#
# Repo variables, all from the platform's squad deployment outputs and none of them secrets:
#   AZURE_CLIENT_ID      squadDeployerClientId
#   AZURE_TENANT_ID      the tenant
#   AZURE_SUBSCRIPTION_ID the subscription
#   FUNCTION_APP_NAME    functionAppName
#   RESOURCE_GROUP       resourceGroup
#   SQUAD_EMAIL          where infra/main.bicep sends alerts
#
# The repo also needs a GitHub environment called "production": the squad deployer identity
# only trusts tokens issued to jobs running in that environment.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app
          include-hidden-files: true

  deploy-code:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Flex Consumption one-deploy. Uses the Entra token from azure/login, since basic
      # publishing credentials are disabled on the app.
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: app
          sku: flexconsumption

  # The escape hatch. Only runs if the squad has an infra/ folder with a main.bicep.
  deploy-infra:
    needs: build
    if: hashFiles('infra/main.bicep') != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: >
          az deployment group create
          --resource-group "${{ vars.RESOURCE_GROUP }}"
          --template-file infra/main.bicep
          --parameters squadEmail="${{ vars.SQUAD_EMAIL }}" functionAppName="${{ vars.FUNCTION_APP_NAME }}"
