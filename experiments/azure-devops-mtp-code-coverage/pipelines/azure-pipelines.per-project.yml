# Alternative layout: one job per test project, running in parallel.
#
# Use this when test projects are slow or need different agents. Each job runs a single project
# with `dotnet test --project`, and that project's testconfig.json still decides what its coverage
# includes and what bar it has to clear, exactly as in azure-pipelines.yml.
#
# Trade-off: Azure DevOps keeps one coverage report per run, and the last PublishCodeCoverageResults
# to finish wins. So this layout publishes test results from every job, but merges coverage in a final
# job that downloads every job's reports.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  experimentPath: experiments/azure-devops-mtp-code-coverage

jobs:
  - job: test
    displayName: Test
    strategy:
      matrix:
        domain:
          testProject: Orders.Domain.Tests
        api:
          testProject: Orders.Api.Tests
        integration:
          testProject: Orders.Integration.Tests   # xUnit v3: same steps, same testconfig.json format
    steps:
      - checkout: self
        fetchDepth: 1

      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(experimentPath)

      - task: PowerShell@2
        displayName: Test $(testProject) with coverage (MTP)
        inputs:
          pwsh: true
          targetType: inline
          workingDirectory: $(experimentPath)
          script: |
            dotnet test `
              --project tests/$(testProject) `
              --configuration Release `
              --no-progress `
              --results-directory "$(Agent.TempDirectory)/TestResults" `
              --coverage `
              --report-trx `
              --report-trx-filename '{asm}.trx'
            exit $LASTEXITCODE

      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '*.trx'
          searchFolder: $(Agent.TempDirectory)/TestResults
          testRunTitle: $(testProject)
          failTaskOnFailedTests: false

      # Point -TestsDirectory at this project's folder only: the other projects' reports aren't on this
      # agent, and the gate would (rightly) fail them as missing.
      - task: PowerShell@2
        displayName: Enforce $(testProject) coverage
        inputs:
          pwsh: true
          filePath: $(experimentPath)/scripts/Test-CoverageGate.ps1
          arguments: >-
            -ResultsDirectory "$(Agent.TempDirectory)/TestResults"
            -TestsDirectory "tests/$(testProject)"
            -SummaryPath "$(Agent.TempDirectory)/coverage-summary.md"
          workingDirectory: $(experimentPath)

      - publish: $(Agent.TempDirectory)/TestResults
        artifact: coverage-$(testProject)
        condition: succeededOrFailed()

  - job: coverage
    displayName: Merge and publish coverage
    dependsOn: test
    condition: succeededOrFailed()
    steps:
      - checkout: self
        fetchDepth: 1
      - download: current
        patterns: 'coverage-*/*.cobertura.xml'
      - task: UseDotNet@2
        inputs:
          packageType: sdk
          useGlobalJson: true
          workingDirectory: $(experimentPath)
      # Bring every job's files into one folder, then publish them as ONE merged report.
      - pwsh: |
          New-Item -ItemType Directory -Force "$(Agent.TempDirectory)/AllCoverage" | Out-Null
          Get-ChildItem "$(Pipeline.Workspace)" -Recurse -Filter *.cobertura.xml |
            Copy-Item -Destination "$(Agent.TempDirectory)/AllCoverage"
        displayName: Collect coverage from every job
      - task: PublishCodeCoverageResults@2
        inputs:
          summaryFileLocation: $(Agent.TempDirectory)/AllCoverage/*.cobertura.xml
          pathToSources: $(Build.SourcesDirectory)
          failIfCoverageEmpty: true
      - task: PowerShell@2
        displayName: Merged coverage summary
        inputs:
          pwsh: true
          filePath: $(experimentPath)/scripts/New-CoverageReport.ps1
          arguments: -ResultsDirectory "$(Agent.TempDirectory)/AllCoverage" -PublishSummary
          workingDirectory: $(experimentPath)
