# Broken on purpose: `depends_on` instead of `dependsOn`. Azure DevOps would ignore it and run payments-api in parallel with everything else.
#
#   dotnet run validate-manifest.cs -- --manifest test/fixtures/typo-in-key.yml
extends:
  template: ../../../pipelines/templates/release.yml
  parameters:
    release: '2026.11.04'
    steps:
      - { id: deploy_identity,  deploy: identity-api,  version: 1.5.2 }
      - { id: deploy_catalog,   deploy: catalog-api,   version: 3.0.4 }
      - { id: deploy_customers, deploy: customers-api, version: 1.2.0, dependsOn: [deploy_identity] }
      - { id: deploy_payments, deploy: payments-api, version: 2.3.1, depends_on: [deploy_customers] }
      - { id: deploy_orders,    deploy: orders-api,    version: 1.8.0, dependsOn: [deploy_catalog, deploy_payments] }
