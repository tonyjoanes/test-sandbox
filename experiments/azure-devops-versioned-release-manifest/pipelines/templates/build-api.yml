# Shared build template for every API. It builds, tests and publishes ONE immutable, versioned
# Universal Package to the Azure Artifacts feed. It does not deploy anywhere.
#
# The package version is the pipeline's build number, which each API's azure-pipelines.yml sets
# with `name: <major>.<minor>.$(Rev:r)`. The package contains:
#   app.zip             - the `dotnet publish` output, ready for App Service zip deploy
#   release-rules.yaml  - this version's deployment dependencies (read by the release pipeline)
#   build-info.json     - the commit, branch and build that produced it
#
# Only builds of main are published. PR builds still compile and test, but they never produce a
# package, so nothing that skipped review can end up in a release manifest.

parameters:
  - name: api
    type: string
  - name: project
    type: string
  - name: testProjects
    type: string
    default: ''
  - name: feed
    type: string
    default: Platform/api-releases
  - name: dotnetVersion
    type: string
    default: 8.x
  # Where assemble-package.sh lives. With the templates in their own repo, check that repo out
  # alongside the API and point this at it.
  - name: scriptsPath
    type: string
    default: experiments/azure-devops-versioned-release-manifest/pipelines/scripts

stages:
  - stage: build
    displayName: Build ${{ parameters.api }} $(Build.BuildNumber)
    pool:
      vmImage: ubuntu-latest
    jobs:
      - job: build
        variables:
          version: $(Build.BuildNumber)
        steps:
          - checkout: self
            persistCredentials: true  # lets the tag step below push

          - task: UseDotNet@2
            inputs:
              version: ${{ parameters.dotnetVersion }}

          - ${{ if ne(parameters.testProjects, '') }}:
            - task: DotNetCoreCLI@2
              displayName: Test
              inputs:
                command: test
                projects: ${{ parameters.testProjects }}

          # The same script the local packaging tests run (scripts/test-packaging.cs).
          - bash: >
              bash ${{ parameters.scriptsPath }}/assemble-package.sh
              '${{ parameters.api }}' '${{ parameters.project }}' '$(version)'
              '$(Build.ArtifactStagingDirectory)/package'
            displayName: Assemble package ${{ parameters.api }} $(version)

          - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
            - task: UniversalPackages@0
              displayName: Publish ${{ parameters.api }} $(version) to ${{ parameters.feed }}
              inputs:
                command: publish
                publishDirectory: $(Build.ArtifactStagingDirectory)/package
                feedsToUsePublish: internal
                vstsFeedPublish: ${{ parameters.feed }}
                vstsFeedPackagePublish: ${{ parameters.api }}
                versionOption: custom
                versionPublish: $(version)
                packagePublishDescription: ${{ parameters.api }} $(version) from $(Build.SourceVersion)

            # Tag the commit so every package version leads straight back to its source. Needs
            # "Contribute" and "Create tag" on the repo for the project's build service identity.
            - bash: |
                set -euo pipefail
                tag="${{ parameters.api }}/v$(version)"
                git tag -a "$tag" -m "${{ parameters.api }} $(version) (build $(Build.BuildId))"
                git push origin "$tag"
              displayName: Tag commit ${{ parameters.api }}/v$(version)
