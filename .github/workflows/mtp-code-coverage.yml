# Runs experiments/azure-devops-mtp-code-coverage/ in this GitHub sandbox.
# The experiment targets Azure DevOps (pipelines/azure-pipelines.yml). This workflow runs the same
# dotnet commands so the tests, the per-project coverage settings and the coverage gate are
# proven on every change. See the experiment's README.

name: MTP Code Coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/azure-devops-mtp-code-coverage/**'
      - '.github/workflows/mtp-code-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/azure-devops-mtp-code-coverage/**'
      - '.github/workflows/mtp-code-coverage.yml'

defaults:
  run:
    working-directory: experiments/azure-devops-mtp-code-coverage

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    name: Test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: experiments/azure-devops-mtp-code-coverage/global.json
      - name: Build
        run: dotnet build Orders.slnx --configuration Release
      - name: Test with coverage (MTP)
        run: >-
          dotnet test --solution Orders.slnx --configuration Release --no-build --no-progress
          --results-directory "$RUNNER_TEMP/TestResults"
          --coverage --report-trx --report-trx-filename '{asm}.trx'
      - name: Enforce per-project coverage
        run: >-
          dotnet run scripts/check-coverage.cs --
          --results "$RUNNER_TEMP/TestResults" --tests tests --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults
